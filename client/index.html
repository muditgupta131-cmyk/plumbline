<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Plumbline — AI Powered Stock &amp; Portfolio Analysis</title>
    <meta
      name="description"
      content="Analyse stocks, build portfolios and get AI-generated research on fundamentals, risk and valuation. Plumbline turns market data into decisions."
    />
    <meta name="theme-color" content="#060B18" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F8FB" media="(prefers-color-scheme: light)" />
    <link rel="canonical" href="https://plumbline.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Plumbline" />
    <meta property="og:title" content="Plumbline — AI Powered Stock &amp; Portfolio Analysis" />
    <meta
      property="og:description"
      content="Analyse stocks, build portfolios and get AI-generated research on fundamentals, risk and valuation."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('plumbline.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
